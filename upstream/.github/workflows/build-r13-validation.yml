name: "Build R13 Validation Package (Windows)"

on:
  workflow_dispatch:
    inputs:
      upload-artifacts:
        description: "Upload the R13 validation installer artifacts"
        required: true
        type: boolean
        default: true

# This workflow is deliberately separate from release packaging. Its Tauri
# overlay gives the installed application a different Windows application ID.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-r13-validation:
    name: Build R13 validation package (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validation package identity
        id: validation-identity
        shell: pwsh
        run: |
          $overlayPath = 'frontend/src-tauri/tauri.r13-validation.conf.json'
          $overlay = Get-Content -LiteralPath $overlayPath -Raw | ConvertFrom-Json
          $properties = @($overlay.PSObject.Properties.Name)
          if (@($properties | Where-Object { $_ -notin @('productName', 'identifier') }).Count -ne 0) {
            throw "R13 validation overlay must only override package identity."
          }
          if ($overlay.productName -ne 'meetily-r13-validation' -or $overlay.identifier -ne 'com.meetily.ai.r13validation') {
            throw "R13 validation package identity does not match the approved isolated values."
          }
          "product_name=$($overlay.productName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "identifier=$($overlay.identifier)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate D-drive profile helper
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File 'frontend/src-tauri/scripts/prepare-r13-validation-profile.ps1' -ValidationRoot 'D:\Meetly-R13-Validation' -WhatIf

      - name: Get version from base Tauri configuration
        id: get-version
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'frontend/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($config.identifier -ne 'com.meetily.ai' -or $config.productName -ne 'meetily') {
            throw "The normal package identity must not be changed by R13 validation work."
          }
          "version=$($config.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: pwsh
        run: '"STORE_PATH=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: windows-r13-validation-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-r13-validation-pnpm-

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc

      - name: Verify active toolchain matches rust-toolchain.toml
        shell: pwsh
        run: |
          $expected = (Select-String -Path rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $actual = ((rustc --version) -replace '^rustc ', '') -replace ' \(.*\)$', ''
          if ($actual -ne $expected) { throw "Active toolchain $actual does not match $expected." }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-r13-validation-v1

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          pnpm install --frozen-lockfile

      - name: Cache retrieval model artifacts
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/meetily/model-cache
          key: windows-x64-retrieval-bundle-${{ hashFiles('frontend/src-tauri/resources/retrieval/model-bundle.manifest.json') }}
          restore-keys: |
            windows-x64-retrieval-bundle-

      - name: Stage and verify retrieval model bundle
        shell: pwsh
        run: ./frontend/src-tauri/scripts/stage-retrieval-models.ps1

      - name: Build llama-helper sidecar
        shell: pwsh
        run: |
          cargo build --release -p llama-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path 'frontend/src-tauri/binaries' | Out-Null
          Copy-Item 'target/release/llama-helper.exe' 'frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe'

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Build R13 validation Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MEETILY_RSA_PUBLIC_KEY: ${{ secrets.MEETILY_RSA_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          projectPath: frontend
          args: --target x86_64-pc-windows-msvc --features vulkan --config src-tauri/tauri.r13-validation.conf.json

      - name: Verify R13 validation installers exist
        shell: pwsh
        run: |
          $bundleRoot = 'target/x86_64-pc-windows-msvc/release/bundle'
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'msi') -Filter '*.msi' -File -ErrorAction Stop)
          $nsis = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'nsis') -Filter '*.exe' -File -ErrorAction Stop)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw "Expected exactly one MSI and one NSIS R13 validation installer." }
          if ($msi[0].Name -notmatch 'meetily-r13-validation' -or $nsis[0].Name -notmatch 'meetily-r13-validation') {
            throw "R13 validation installer names do not carry the isolated product identity."
          }
          Get-FileHash -Algorithm SHA256 $msi[0], $nsis[0] | Format-Table -AutoSize

      - name: Upload R13 validation artifacts
        if: ${{ github.event.inputs.upload-artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: meetily-r13-validation-windows-x64-${{ steps.get-version.outputs.version }}
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            frontend/src-tauri/scripts/prepare-r13-validation-profile.ps1
          retention-days: 30

      - name: Generate validation summary
        shell: pwsh
        run: |
          @"
          ## R13 Validation Package (not a release artifact)

          | Property | Value |
          | --- | --- |
          | Version | ${{ steps.get-version.outputs.version }} |
          | Product name | ${{ steps.validation-identity.outputs.product_name }} |
          | Application identifier | ${{ steps.validation-identity.outputs.identifier }} |
          | Target | x86_64-pc-windows-msvc |
          | Retrieval bundle | manifest-verified by stage-retrieval-models.ps1 |
          | D: validation root | Run `prepare-r13-validation-profile.ps1 -ValidationRoot D:\Meetly-R13-Validation` before first launch. It creates validation-ID-only junctions from Windows app-data roots to `D:\Meetly-R13-Validation`. |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
