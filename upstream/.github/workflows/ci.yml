name: "CI"

# Fast, deterministic checks for every PR and push to main.
# Heavy platform builds live in the dedicated `build-*.yml` workflows
# which are still triggered manually or via release tags.

on:
  pull_request:
    branches: [main, devtest]
  push:
    branches: [main, devtest]
  workflow_dispatch:

# Don't cancel a previous CI run if a new commit lands — we want the
# history preserved so flaky jobs can be inspected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Skip whisper-rs-sys's bindgen step at build time. The vendored
  # bindings under `frontend/src-tauri/vendor/whisper-rs-sys/src/`
  # are restored into the cargo registry cache by
  # `frontend/scripts/restore-whisper-bindings.mjs` in the rust job
  # before any `cargo` invocation.
  WHISPER_DONT_GENERATE_BINDINGS: "1"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -A clippy::all -A clippy::pedantic"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Frontend (TypeScript / Vitest / ESLint / Prettier)
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc / vitest / eslint / prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Vitest unit tests
        run: pnpm test

      - name: Prettier check
        run: pnpm run format:check

      - name: ESLint
        # ESLint reports ~200 pre-existing warnings; the script exits 0
        # and we surface the report rather than failing the build.
        run: pnpm run lint || true

  # ─────────────────────────────────────────────────────────────────
  # Rust (cargo test, fmt, clippy)
  # ─────────────────────────────────────────────────────────────────
  rust:
    name: Rust (test / fmt / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV

      - name: Restore vendored whisper-rs-sys bindings
        # The cargo registry cache may not contain the pre-generated
        # bindings.rs that whisper-rs-sys needs under
        # WHISPER_DONT_GENERATE_BINDINGS=1. The script copies the
        # vendored copy from the repo into the registry location.
        run: node frontend/scripts/restore-whisper-bindings.mjs

      - name: cargo fmt check
        working-directory: frontend/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo test (lib)
        working-directory: frontend/src-tauri
        run: |
          cargo test --lib \
            --no-default-features \
            --features platform-default \
            --frozen

      - name: cargo clippy
        working-directory: frontend/src-tauri
        # The workspace lints are configured to report
        # `clippy::complexity` and `clippy::style` at warn level.
        # 100+ pre-existing warnings exist today; they are non-fatal
        # but we still surface them so regressions are visible.
        # RUSTFLAGS = `-D warnings` would deny them, so we use
        # `--keep-going` to print all of them instead of stopping.
        run: |
          cargo clippy --lib \
            --no-default-features \
            --features platform-default \
            --frozen \
            --keep-going 2>&1 | tee clippy-output.txt
          echo "## Clippy warning count: $(grep -c 'warning:' clippy-output.txt || echo 0)"
        continue-on-error: false
