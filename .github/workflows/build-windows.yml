name: "Build Windows (CI)"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options: [debug, release]
        default: release
      r13_validation_package:
        description: 'Build the isolated R13 validation package identity'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Package Windows x64 (CPU)
    runs-on: windows-latest
    outputs:
      build-profile: ${{ steps.build-profile.outputs.profile }}
      r13-validation: ${{ steps.r13-validation.outputs.enabled }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' upstream/frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          # Default to release for push events; allow override via workflow_dispatch input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "args=--debug" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine R13 validation package mode
        id: r13-validation
        shell: pwsh
        run: |
          $r13Requested = '${{ github.event.inputs.r13_validation_package }}' -eq 'true'
          if (-not $r13Requested) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'tauri_args=' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'R13 validation package mode: disabled'
            return
          }

          $overlayPath = 'upstream/frontend/src-tauri/tauri.r13-validation.conf.json'
          $overlay = Get-Content -LiteralPath $overlayPath -Raw | ConvertFrom-Json
          $properties = @($overlay.PSObject.Properties.Name)
          if (@($properties | Where-Object { $_ -notin @('productName', 'identifier') }).Count -ne 0) {
            throw 'R13 validation overlay must only override package identity.'
          }
          if ($overlay.productName -ne 'meetily-r13-validation' -or $overlay.identifier -ne 'com.meetily.ai.r13validation') {
            throw 'R13 validation package identity does not match the approved isolated values.'
          }

          $baseConfig = Get-Content -LiteralPath 'upstream/frontend/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($baseConfig.identifier -ne 'com.meetily.ai' -or $baseConfig.productName -ne 'meetily') {
            throw 'The normal package identity must not be changed by R13 validation work.'
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File 'upstream/frontend/src-tauri/scripts/prepare-r13-validation-profile.ps1' -ValidationRoot 'D:\Meetly-R13-Validation' -WhatIf

          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'tauri_args=--features r13-validation --config src-tauri/tauri.r13-validation.conf.json' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'R13 validation package mode: enabled'

      # --- Frontend setup ---
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('upstream/frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd upstream/frontend
          pnpm install --frozen-lockfile

      # --- Rust setup ---
      - name: Read pinned Rust channel from rust-toolchain.toml
        id: rust-channel
        shell: bash
        run: |
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' upstream/rust-toolchain.toml)
          if [ -z "$CHANNEL" ]; then echo "no channel found in upstream/rust-toolchain.toml"; exit 1; fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Verify active toolchain matches rust-toolchain.toml
        shell: pwsh
        run: |
          $expected = (Select-String -Path upstream/rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $actual = ((rustc --version) -replace '^rustc ', '') -replace ' \(.*\)$', ''
          Write-Host "rust-toolchain.toml channel: $expected; active rustc: $actual"
          if ($actual -ne $expected) {
            Write-Error "Active toolchain $actual does not match the pinned $expected"
            exit 1
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"
          key: windows-x64-cpu-v2

      # --- Task 1.R1 release gate: staged retrieval bundle + reference inference ---
      - name: Locate retrieval model cache directory
        shell: bash
        run: echo "MODEL_CACHE_PATH=$LOCALAPPDATA\\meetily\\model-cache" >> $GITHUB_ENV

      - name: Cache retrieval model artifacts
        id: retrieval-model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE_PATH }}
          key: windows-x64-retrieval-models-${{ hashFiles('upstream/frontend/src-tauri/resources/retrieval/model-bundle.manifest.json') }}
          restore-keys: |
            windows-x64-retrieval-models-

      # Cargo downloads/overwrites registry sources on a fresh cache, so fetch
      # first, then restore the vendored whisper-rs-sys bindings into it
      # (mirrors upstream/.github/workflows/ci.yml).
      - name: Fetch deps and restore whisper-rs-sys bindings
        shell: bash
        run: |
          cd upstream
          cargo fetch --locked
          node frontend/scripts/restore-whisper-bindings.mjs

      - name: Build llama-helper sidecar
        id: llama-helper
        shell: bash
        continue-on-error: true
        env:
          LLAMA_DEBUG_LOG: ${{ runner.temp }}/llama_helper_out.txt
        run: |
          cd upstream
          # Capture all output so it can be attached as an artifact (use RUNNER_TEMP,
          # not /tmp/, since /tmp/ is not recognized by upload-artifact on Windows).
          LOG="$LLAMA_DEBUG_LOG"
          TARGET="x86_64-pc-windows-msvc"
          set +e
          if [[ "${{ steps.build-profile.outputs.profile }}" == "debug" ]]; then
            echo "Building llama-helper in debug profile..."
            cargo build --locked -p llama-helper > "$LOG" 2>&1
            RC=$?
            EXT=".exe"
            SRC="target/debug/llama-helper${EXT}"
          else
            echo "Building llama-helper in release profile..."
            cargo build --locked --release -p llama-helper > "$LOG" 2>&1
            RC=$?
            EXT=".exe"
            SRC="target/release/llama-helper${EXT}"
          fi
          set -e
          echo "llama_helper_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "=== LLAMA-HELPER BUILD EXIT CODE: $RC ==="
          cat "$LOG"
          if [ "$RC" -ne 0 ]; then exit 0; fi
          # Copy to sidecar location (Tauri externalBin expects the target-triple-qualified name)
          mkdir -p frontend/src-tauri/binaries
          cp "$SRC" "frontend/src-tauri/binaries/llama-helper-$TARGET$EXT"
          ls -la frontend/src-tauri/binaries/

      - name: Upload llama-helper build output (for public debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-helper-output
          path: ${{ runner.temp }}/llama_helper_out.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if llama-helper build failed
        if: steps.llama-helper.outputs.llama_helper_exit_code != '0'
        shell: bash
        run: |
          echo "llama-helper build failed with exit code ${{ steps.llama-helper.outputs.llama_helper_exit_code }}"
          exit 1

      - name: Validate checked-in production manifest contract
        shell: bash
        run: |
          cd upstream
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --lib model_bundle

      - name: Verify installed-smoke harness self-tests
        shell: pwsh
        run: ./upstream/frontend/src-tauri/scripts/windows-package-smoke.tests.ps1

      - name: Measure retrieval cache before staging
        shell: pwsh
        env:
          MODEL_CACHE_HIT: ${{ steps.retrieval-model-cache.outputs.cache-hit }}
        run: ./upstream/frontend/src-tauri/scripts/windows-package-smoke.ps1 -Mode MeasureBefore

      - name: Stage and verify retrieval model bundle
        shell: pwsh
        run: ./upstream/frontend/src-tauri/scripts/stage-retrieval-models.ps1

      - name: Assert staged bundle contains all verified artifacts
        shell: bash
        env:
          MEETLY_RAG_VERIFY_STAGED_BUNDLE: "1"
        run: |
          cd upstream
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --lib staged_production_bundle -- --nocapture

      - name: Reference inference on staged production bundle (tokenizer + embedding + reranker)
        shell: bash
        env:
          MEETLY_RAG_BUNDLE_DIR: ${{ github.workspace }}/upstream/frontend/src-tauri/resources/retrieval/bundle
        run: |
          cd upstream
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --test model_benchmark reference_inference_is_stable_finite_and_dimensional -- --nocapture

      # --- Build ---
      - name: Verify reviewed Tauri resource-expansion toolchain
        shell: bash
        run: |
          cd upstream/frontend
          # CLI 2.11.1 uses the tauri-utils 2.9.1 authority in Task 5.4a.
          # Frozen install and this assertion prevent an unnoticed CLI upgrade.
          ACTUAL=$(pnpm exec tauri --version 2>&1)
          if [[ "$ACTUAL" != "tauri-cli 2.11.1" ]]; then
            echo "package-toolchain: status=cli_version_rejected"
            exit 1
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('node_modules/@tauri-apps/cli/package.json')); const h=fs.readFileSync('../tools/retrieval-package-contract/Cargo.toml','utf8'); if(p.version!=='2.11.1'||!h.includes('tauri-utils = { version = \"=2.9.1\"')) process.exit(1);"
          echo "package-toolchain: status=passed cli=2.11.1 tauri_utils=2.9.1"

      - name: Measure and clean the exact frontend build target
        shell: pwsh
        run: ./upstream/frontend/src-tauri/scripts/windows-package-smoke.ps1 -Mode PrepareBuild

      - name: Build Tauri app (CPU, no GPU acceleration)
        id: tauri-build
        shell: bash
        continue-on-error: true
        env:
          TAURI_BUILD_LOG: ${{ runner.temp }}/tauri_build_out.txt
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream/frontend/target
        run: |
          cd upstream/frontend
          # The guarded preparation step cleaned this exact target, not the Rust cache.
          set +e
          pnpm tauri build ${{ steps.build-profile.outputs.args }} ${{ steps.r13-validation.outputs.tauri_args }} --verbose -- --locked > "$TAURI_BUILD_LOG" 2>&1
          RC=$?
          set -e
          echo "tauri_build_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "=== TAURI BUILD EXIT CODE: $RC ==="
          cat "$TAURI_BUILD_LOG"
          exit 0

      - name: Upload Tauri build output (for public debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-output
          path: ${{ runner.temp }}/tauri_build_out.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Write build outputs to step summary
        if: always()
        shell: bash
        run: |
          # Write to step summary so it's visible via the public check-runs API
          {
            echo "## Tauri Build Output"
            echo '```'
            cat "$RUNNER_TEMP/tauri_build_out.txt" 2>/dev/null || echo "(no file)"
            echo '```'
            echo ""
            echo "## Llama-Helper Build Output"
            echo '```'
            cat "$RUNNER_TEMP/llama_helper_out.txt" 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Tauri build failed
        if: steps.tauri-build.outputs.tauri_build_exit_code != '0'
        shell: bash
        run: |
          echo "Tauri build failed with exit code ${{ steps.tauri-build.outputs.tauri_build_exit_code }}"
          exit 1

      - name: Verify R13 validation artifact identity
        if: steps.r13-validation.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bundleRoot = 'upstream/frontend/target/${{ steps.build-profile.outputs.profile }}/bundle'
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'msi') -Filter '*.msi' -File -ErrorAction Stop)
          $nsis = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'nsis') -Filter '*.exe' -File -ErrorAction Stop)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw 'Expected exactly one MSI and one NSIS R13 validation installer.' }
          if ($msi[0].Name -notmatch 'meetily-r13-validation' -or $nsis[0].Name -notmatch 'meetily-r13-validation') {
            throw 'R13 validation installer names do not carry the isolated product identity.'
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $null
          $view = $null
          $record = $null
          try {
            $database = $installer.OpenDatabase([IO.Path]::GetFullPath($msi[0].FullName), 0)
            $view = $database.OpenView("SELECT `Value` FROM `Property` WHERE `Property`='ProductName'")
            $null = $view.Execute()
            $record = $view.Fetch()
            if ($null -eq $record -or [string]$record.StringData(1) -cne 'meetily-r13-validation') {
              throw 'R13 validation MSI ProductName does not carry the isolated product identity.'
            }
          } finally {
            if ($null -ne $record) { $null = [Runtime.InteropServices.Marshal]::FinalReleaseComObject($record) }
            if ($null -ne $view) { $null = [Runtime.InteropServices.Marshal]::FinalReleaseComObject($view) }
            if ($null -ne $database) { $null = [Runtime.InteropServices.Marshal]::FinalReleaseComObject($database) }
            if ($null -ne $installer) { $null = [Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer) }
          }
          Get-FileHash -Algorithm SHA256 $msi[0], $nsis[0] | Format-Table -AutoSize

      - name: Rename build profile dir for upload
        shell: bash
        run: |
          if [[ "${{ steps.build-profile.outputs.profile }}" == "debug" ]]; then
            ARTIFACT_DIR="upstream/frontend/target/debug"
          else
            ARTIFACT_DIR="upstream/frontend/target/release"
          fi
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV

      - name: Measure staged bundle and build cache impact
        shell: pwsh
        run: ./upstream/frontend/src-tauri/scripts/windows-package-smoke.ps1 -Mode MeasureAfter

      - name: Prepare package-smoke handoff
        if: steps.r13-validation.outputs.enabled != 'true'
        shell: pwsh
        run: |
          # The installed smokes run on fresh runners. Hand off only their two
          # package directories and sanitized measurement evidence.
          $handoff = Join-Path $env:RUNNER_TEMP 'meetily-package-smoke-input'
          $bundle = Join-Path $env:GITHUB_WORKSPACE "$env:ARTIFACT_DIR/bundle"
          if (-not (Test-Path -LiteralPath (Join-Path $bundle 'msi') -PathType Container) -or
              -not (Test-Path -LiteralPath (Join-Path $bundle 'nsis') -PathType Container) -or
              -not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'meetily-package-sizes.json') -PathType Leaf)) {
            throw 'package_smoke_handoff_input_missing'
          }
          New-Item -ItemType Directory -Path (Join-Path $handoff 'packages') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $handoff 'evidence') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $handoff 'packages/bundle') -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $bundle 'msi') -Destination (Join-Path $handoff 'packages/bundle/msi') -Recurse
          Copy-Item -LiteralPath (Join-Path $bundle 'nsis') -Destination (Join-Path $handoff 'packages/bundle/nsis') -Recurse
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'meetily-package-sizes.json') -Destination (Join-Path $handoff 'evidence/meetily-package-sizes.json')

      - name: Upload package-smoke input
        if: steps.r13-validation.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-package-smoke-input
          path: |
            ${{ runner.temp }}/meetily-package-smoke-input/packages
            ${{ runner.temp }}/meetily-package-smoke-input/evidence
          if-no-files-found: error
          retention-days: 1

      # --- Upload ---
      - name: Upload MSI installer
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.r13-validation.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-msi-v${{ steps.get-version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NSIS installer
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.r13-validation.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-nsis-v${{ steps.get-version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload compiled exe (for dev testing)
        if: github.event_name == 'workflow_dispatch' && steps.r13-validation.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-exe-v${{ steps.get-version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/meetily.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload isolated R13 validation package
        if: steps.r13-validation.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-r13-validation-windows-x64-v${{ steps.get-version.outputs.version }}
          path: |
            ${{ env.ARTIFACT_DIR }}/bundle/msi/*.msi
            ${{ env.ARTIFACT_DIR }}/bundle/nsis/*.exe
            ${{ env.ARTIFACT_DIR }}/meetily.exe
            upstream/frontend/src-tauri/scripts/prepare-r13-validation-profile.ps1
          if-no-files-found: error
          retention-days: 30

  smoke-msi:
    name: Installed MSI smoke (Windows)
    needs: build-windows
    if: needs.build-windows.outputs.r13-validation != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package-smoke input
        uses: actions/download-artifact@v4
        with:
          name: meetily-windows-package-smoke-input
          path: ${{ runner.temp }}/meetily-package-smoke-input

      - name: Restore MSI smoke input
        shell: pwsh
        env:
          ARTIFACT_DIR: upstream/frontend/target/${{ needs.build-windows.outputs.build-profile }}
        run: |
          $input = Join-Path $env:RUNNER_TEMP 'meetily-package-smoke-input'
          $sourceBundle = Join-Path $input 'packages/bundle'
          $sourceSizes = Join-Path $input 'evidence/meetily-package-sizes.json'
          $targetBundle = Join-Path $env:GITHUB_WORKSPACE "$env:ARTIFACT_DIR/bundle"
          if (-not (Test-Path -LiteralPath (Join-Path $sourceBundle 'msi') -PathType Container) -or
              -not (Test-Path -LiteralPath $sourceSizes -PathType Leaf)) { throw 'package_smoke_input_invalid' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $targetBundle) -Force | Out-Null
          Copy-Item -LiteralPath $sourceBundle -Destination $targetBundle -Recurse
          Copy-Item -LiteralPath $sourceSizes -Destination (Join-Path $env:RUNNER_TEMP 'meetily-package-sizes.json')

      - name: Install and run MSI dbstat and retrieval smoke
        id: smoke-msi
        shell: pwsh
        timeout-minutes: 20
        continue-on-error: true
        env:
          ARTIFACT_DIR: upstream/frontend/target/${{ needs.build-windows.outputs.build-profile }}
        run: ./upstream/frontend/src-tauri/scripts/windows-package-smoke.ps1 -Mode Smoke -Kind msi

      - name: Upload sanitized MSI installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-installed-smoke-msi-evidence
          path: |
            ${{ runner.temp }}/meetily-smoke-msi-result.json
            ${{ runner.temp }}/meetily-package-sizes.json
          if-no-files-found: warn
          retention-days: 30

  smoke-nsis:
    name: Installed NSIS smoke (Windows)
    needs: build-windows
    if: needs.build-windows.outputs.r13-validation != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package-smoke input
        uses: actions/download-artifact@v4
        with:
          name: meetily-windows-package-smoke-input
          path: ${{ runner.temp }}/meetily-package-smoke-input

      - name: Restore NSIS smoke input
        shell: pwsh
        env:
          ARTIFACT_DIR: upstream/frontend/target/${{ needs.build-windows.outputs.build-profile }}
        run: |
          $input = Join-Path $env:RUNNER_TEMP 'meetily-package-smoke-input'
          $sourceBundle = Join-Path $input 'packages/bundle'
          $sourceSizes = Join-Path $input 'evidence/meetily-package-sizes.json'
          $targetBundle = Join-Path $env:GITHUB_WORKSPACE "$env:ARTIFACT_DIR/bundle"
          if (-not (Test-Path -LiteralPath (Join-Path $sourceBundle 'nsis') -PathType Container) -or
              -not (Test-Path -LiteralPath $sourceSizes -PathType Leaf)) { throw 'package_smoke_input_invalid' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $targetBundle) -Force | Out-Null
          Copy-Item -LiteralPath $sourceBundle -Destination $targetBundle -Recurse
          Copy-Item -LiteralPath $sourceSizes -Destination (Join-Path $env:RUNNER_TEMP 'meetily-package-sizes.json')

      - name: Install and run NSIS dbstat and retrieval smoke
        id: smoke-nsis
        shell: pwsh
        timeout-minutes: 20
        continue-on-error: true
        env:
          ARTIFACT_DIR: upstream/frontend/target/${{ needs.build-windows.outputs.build-profile }}
        run: ./upstream/frontend/src-tauri/scripts/windows-package-smoke.ps1 -Mode Smoke -Kind nsis

      - name: Upload sanitized NSIS installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-installed-smoke-nsis-evidence
          path: |
            ${{ runner.temp }}/meetily-smoke-nsis-result.json
            ${{ runner.temp }}/meetily-package-sizes.json
          if-no-files-found: warn
          retention-days: 30

  gate-installed-package-smoke:
    # Retain the established required-check identity on the terminal verdict,
    # not merely on the package-producing predecessor.
    name: Build Windows x64 (CPU)
    needs: [build-windows, smoke-msi, smoke-nsis]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MSI smoke evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: meetily-windows-installed-smoke-msi-evidence
          path: ${{ runner.temp }}/meetily-smoke-msi-evidence

      - name: Download NSIS smoke evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: meetily-windows-installed-smoke-nsis-evidence
          path: ${{ runner.temp }}/meetily-smoke-nsis-evidence

      - name: Restore gate evidence
        shell: pwsh
        run: |
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'meetily-smoke-msi-evidence/meetily-smoke-msi-result.json') -Destination (Join-Path $env:RUNNER_TEMP 'meetily-smoke-msi-result.json') -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'meetily-smoke-nsis-evidence/meetily-smoke-nsis-result.json') -Destination (Join-Path $env:RUNNER_TEMP 'meetily-smoke-nsis-result.json') -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'meetily-smoke-msi-evidence/meetily-package-sizes.json') -Destination (Join-Path $env:RUNNER_TEMP 'meetily-package-sizes.json') -ErrorAction SilentlyContinue

      - name: Fail if Windows package build did not pass
        if: needs.build-windows.result != 'success'
        shell: pwsh
        run: exit 1

      - name: Fail if an executed installed-package smoke failed
        if: needs.build-windows.outputs.r13-validation != 'true'
        shell: pwsh
        env:
          MSI_SMOKE_OUTCOME: ${{ needs.smoke-msi.result }}
          NSIS_SMOKE_OUTCOME: ${{ needs.smoke-nsis.result }}
        run: |
          # Skipped smokes leave earlier build failures intact. Executed smokes
          # must have current-SHA evidence for BOTH diagnostics and teardown.
          ./upstream/frontend/src-tauri/scripts/windows-package-smoke.ps1 -Mode Gate -MsiOutcome $env:MSI_SMOKE_OUTCOME -NsisOutcome $env:NSIS_SMOKE_OUTCOME

      - name: Record deferred R13 installed-package smoke
        if: needs.build-windows.outputs.r13-validation == 'true'
        shell: pwsh
        run: |
          Write-Host 'R13 package identity was verified before upload. Installed-package smokes are deferred to the isolated D: native validation session because this harness intentionally assumes the normal meetily install layout.'

      - name: Upload sanitized installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-installed-smoke-evidence
          path: |
            ${{ runner.temp }}/meetily-smoke-msi-result.json
            ${{ runner.temp }}/meetily-smoke-nsis-result.json
            ${{ runner.temp }}/meetily-package-sizes.json
          if-no-files-found: warn
          retention-days: 30

  # Quick cargo check on every push (faster than full build)
  check-rust:
    name: Cargo Check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned Rust channel from rust-toolchain.toml
        id: rust-channel
        shell: bash
        run: |
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' upstream/rust-toolchain.toml)
          if [ -z "$CHANNEL" ]; then echo "no channel found in upstream/rust-toolchain.toml"; exit 1; fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Verify active toolchain matches rust-toolchain.toml
        shell: pwsh
        run: |
          $expected = (Select-String -Path upstream/rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $actual = ((rustc --version) -replace '^rustc ', '') -replace ' \(.*\)$', ''
          Write-Host "rust-toolchain.toml channel: $expected; active rustc: $actual"
          if ($actual -ne $expected) {
            Write-Error "Active toolchain $actual does not match the pinned $expected"
            exit 1
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"
          key: windows-x64-check-v2

      - name: Fetch deps and restore whisper-rs-sys bindings
        shell: bash
        run: |
          cd upstream
          cargo fetch --locked
          node frontend/scripts/restore-whisper-bindings.mjs

      - name: Build llama-helper sidecar for workspace check
        shell: bash
        env:
          CARGO_TARGET_DIR: target
        run: |
          cd upstream
          cargo build --locked -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/debug/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe

      - name: Cargo check workspace
        id: cargo-check
        shell: bash
        continue-on-error: true
        env:
          CARGO_DEBUG_LOG: ${{ runner.temp }}/cargo_check_out.txt
          CARGO_TARGET_DIR: target
        run: |
          cd upstream
          # Capture all cargo output (no color codes for clean parsing)
          LOG="$CARGO_DEBUG_LOG"
          # GitHub invokes Bash with -e. Persist cargo's result before its gate.
          set +e
          CARGO_TERM_COLOR=never cargo check --locked --workspace --message-format=short > "$LOG" 2>&1
          RC=$?
          set -e
          echo "cargo_check_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "=== CARGO CHECK EXIT CODE: $RC ==="
          echo "--- CARGO OUTPUT START ---"
          cat "$LOG"
          echo "--- CARGO OUTPUT END ---"
          exit 0   # Always succeed; the artifact upload + a separate check step will surface the failure

      - name: Upload cargo check output (for public debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-output
          path: ${{ runner.temp }}/cargo_check_out.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if cargo check failed
        if: steps.cargo-check.outputs.cargo_check_exit_code != '0'
        shell: bash
        run: |
          echo "Cargo check failed with exit code ${{ steps.cargo-check.outputs.cargo_check_exit_code }}"
          exit 1
