name: "Build Windows (CI)"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options: [debug, release]
        default: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64 (CPU)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' upstream/frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          # Default to release for push events; allow override via workflow_dispatch input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "args=--debug" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # --- Frontend setup ---
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('upstream/frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd upstream/frontend
          pnpm install --no-frozen-lockfile

      # --- Rust setup ---
      - name: Read pinned Rust channel from rust-toolchain.toml
        id: rust-channel
        shell: bash
        run: |
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' upstream/rust-toolchain.toml)
          if [ -z "$CHANNEL" ]; then echo "no channel found in upstream/rust-toolchain.toml"; exit 1; fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Verify active toolchain matches rust-toolchain.toml
        shell: pwsh
        run: |
          $expected = (Select-String -Path upstream/rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $actual = ((rustc --version) -replace '^rustc ', '') -replace ' \(.*\)$', ''
          Write-Host "rust-toolchain.toml channel: $expected; active rustc: $actual"
          if ($actual -ne $expected) {
            Write-Error "Active toolchain $actual does not match the pinned $expected"
            exit 1
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"
          key: windows-x64-cpu-v2

      # --- Task 1.R1 release gate: staged retrieval bundle + reference inference ---
      - name: Locate retrieval model cache directory
        shell: bash
        run: echo "MODEL_CACHE_PATH=$LOCALAPPDATA\\meetily\\model-cache" >> $GITHUB_ENV

      - name: Cache retrieval model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE_PATH }}
          key: windows-x64-retrieval-models-${{ hashFiles('upstream/frontend/src-tauri/resources/retrieval/model-bundle.manifest.json') }}
          restore-keys: |
            windows-x64-retrieval-models-

      # Cargo downloads/overwrites registry sources on a fresh cache, so fetch
      # first, then restore the vendored whisper-rs-sys bindings into it
      # (mirrors upstream/.github/workflows/ci.yml).
      - name: Fetch deps and restore whisper-rs-sys bindings
        shell: bash
        run: |
          cd upstream
          cargo fetch
          node frontend/scripts/restore-whisper-bindings.mjs

      - name: Build llama-helper sidecar
        id: llama-helper
        shell: bash
        continue-on-error: true
        env:
          LLAMA_DEBUG_LOG: ${{ runner.temp }}/llama_helper_out.txt
        run: |
          cd upstream
          # Capture all output so it can be attached as an artifact (use RUNNER_TEMP,
          # not /tmp/, since /tmp/ is not recognized by upload-artifact on Windows).
          LOG="$LLAMA_DEBUG_LOG"
          TARGET="x86_64-pc-windows-msvc"
          if [[ "${{ steps.build-profile.outputs.profile }}" == "debug" ]]; then
            echo "Building llama-helper in debug profile..."
            cargo build --debug -p llama-helper > "$LOG" 2>&1
            RC=$?
            EXT=".exe"
            SRC="target/debug/llama-helper${EXT}"
          else
            echo "Building llama-helper in release profile..."
            cargo build --release -p llama-helper > "$LOG" 2>&1
            RC=$?
            EXT=".exe"
            SRC="target/release/llama-helper${EXT}"
          fi
          echo "llama_helper_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "=== LLAMA-HELPER BUILD EXIT CODE: $RC ==="
          cat "$LOG"
          if [ "$RC" -ne 0 ]; then exit 0; fi
          # Copy to sidecar location (Tauri externalBin expects the target-triple-qualified name)
          mkdir -p frontend/src-tauri/binaries
          cp "$SRC" "frontend/src-tauri/binaries/llama-helper-$TARGET$EXT"
          ls -la frontend/src-tauri/binaries/

      - name: Upload llama-helper build output (for public debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-helper-output
          path: ${{ runner.temp }}/llama_helper_out.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if llama-helper build failed
        if: steps.llama-helper.outputs.llama_helper_exit_code != '0'
        shell: bash
        run: |
          echo "llama-helper build failed with exit code ${{ steps.llama-helper.outputs.llama_helper_exit_code }}"
          exit 1

      - name: Validate checked-in production manifest contract
        shell: bash
        run: |
          cd upstream
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib model_bundle

      - name: Stage and verify retrieval model bundle
        shell: pwsh
        run: ./upstream/frontend/src-tauri/scripts/stage-retrieval-models.ps1

      - name: Assert staged bundle contains all verified artifacts
        shell: bash
        env:
          MEETLY_RAG_VERIFY_STAGED_BUNDLE: "1"
        run: |
          cd upstream
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib staged_production_bundle -- --nocapture

      - name: Reference inference on staged production bundle (tokenizer + embedding + reranker)
        shell: bash
        env:
          MEETLY_RAG_BUNDLE_DIR: ${{ github.workspace }}/upstream/frontend/src-tauri/resources/retrieval/bundle
        run: |
          cd upstream
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --test model_benchmark reference_inference_is_stable_finite_and_dimensional -- --nocapture

      # --- Build ---
      - name: Build Tauri app (CPU, no GPU acceleration)
        id: tauri-build
        shell: bash
        continue-on-error: true
        env:
          TAURI_BUILD_LOG: ${{ runner.temp }}/tauri_build_out.txt
          CARGO_TARGET_DIR: ../target
        run: |
          cd upstream/frontend
          # Clean entire target directory to force full rebuild including bundler
          rm -rf ../target
          pnpm tauri build ${{ steps.build-profile.outputs.args }} --verbose > "$TAURI_BUILD_LOG" 2>&1
          RC=$?
          echo "tauri_build_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "=== TAURI BUILD EXIT CODE: $RC ==="
          cat "$TAURI_BUILD_LOG"
          exit 0

      - name: Upload Tauri build output (for public debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-output
          path: ${{ runner.temp }}/tauri_build_out.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Write build outputs to step summary
        if: always()
        shell: bash
        run: |
          # Write to step summary so it's visible via the public check-runs API
          {
            echo "## Tauri Build Output"
            echo '```'
            cat "$RUNNER_TEMP/tauri_build_out.txt" 2>/dev/null || echo "(no file)"
            echo '```'
            echo ""
            echo "## Llama-Helper Build Output"
            echo '```'
            cat "$RUNNER_TEMP/llama_helper_out.txt" 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Tauri build failed
        if: steps.tauri-build.outputs.tauri_build_exit_code != '0'
        shell: bash
        run: |
          echo "Tauri build failed with exit code ${{ steps.tauri-build.outputs.tauri_build_exit_code }}"
          exit 1

      - name: Rename build profile dir for upload
        shell: bash
        run: |
          if [[ "${{ steps.build-profile.outputs.profile }}" == "debug" ]]; then
            ARTIFACT_DIR="upstream/target/debug"
          else
            ARTIFACT_DIR="upstream/target/release"
          fi
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV

      - name: Install and run MSI dbstat smoke
        id: smoke-msi
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $exitCode = 1
          $installed = $false
          $installer = $null
          $installDir = Join-Path $env:RUNNER_TEMP "meetily-smoke-msi"
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "$env:ARTIFACT_DIR\bundle\msi"

          try {
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }
            $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*.msi" -File)
            if ($installers.Count -ne 1) {
              throw "expected exactly one MSI installer"
            }
            $installer = $installers[0].FullName
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            $installArguments = "/i `"$installer`" /qn /norestart INSTALLDIR=`"$installDir`""
            $installProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList $installArguments -Wait -PassThru
            if ($installProcess.ExitCode -ne 0) {
              throw "MSI installation failed"
            }
            $installed = $true
            # INSTALLDIR is honoured only if the generated WiX exposes that
            # property as its root directory. When it does not, msiexec still
            # succeeds and installs to the default location, so search there
            # too rather than reporting a dbstat failure for a layout mismatch.
            $searchRoots = @(
              $installDir
              (Join-Path $env:ProgramFiles "meetily")
              (Join-Path ${env:ProgramFiles(x86)} "meetily")
            )
            $executables = @(
              $searchRoots |
                Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
                ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter "meetily.exe" -File -Recurse }
            )
            if ($executables.Count -lt 1) {
              throw "installed executable was not found"
            }
            Write-Host "MSI packaged smoke: running installed executable"
            $null = & $executables[0].FullName --smoke-dbstat 2>&1
            $diagnosticExitCode = $LASTEXITCODE
            if ($diagnosticExitCode -ne 0) {
              # Carry the diagnostic's own code so the gate can name the cause;
              # the packaged binary is GUI-subsystem and prints to no console.
              $exitCode = $diagnosticExitCode
              throw "MSI diagnostic failed"
            }
            $exitCode = 0
          }
          catch {
            Write-Host "MSI packaged smoke: failed"
          }
          finally {
            if ($installed -and $null -ne $installer) {
              $uninstallProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/x `"$installer`" /qn /norestart" -Wait -PassThru
              if ($uninstallProcess.ExitCode -ne 0) {
                $exitCode = 1
              }
            }
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $installDir) {
              $exitCode = 1
            }
            "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            if ($exitCode -eq 0) {
              "- MSI packaged dbstat smoke: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              "- MSI packaged dbstat smoke: FAIL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          exit $exitCode

      - name: Install and run NSIS dbstat smoke
        id: smoke-nsis
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $exitCode = 1
          $installed = $false
          $installer = $null
          $installDir = Join-Path $env:RUNNER_TEMP "meetily-smoke-nsis"
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "$env:ARTIFACT_DIR\bundle\nsis"

          try {
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }
            $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*.exe" -File)
            if ($installers.Count -ne 1) {
              throw "expected exactly one NSIS installer"
            }
            $installer = $installers[0].FullName
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            # NSIS requires /D last, unquoted, and to the end of the line. An
            # -ArgumentList array lets PowerShell quote any element containing
            # a space, which NSIS rejects, so pass one raw argument string.
            $installProcess = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -Wait -PassThru
            if ($installProcess.ExitCode -ne 0) {
              throw "NSIS installation failed"
            }
            $installed = $true
            $executables = @(Get-ChildItem -LiteralPath $installDir -Filter "meetily.exe" -File -Recurse)
            if ($executables.Count -lt 1) {
              throw "installed executable was not found"
            }
            Write-Host "NSIS packaged smoke: running installed executable"
            $null = & $executables[0].FullName --smoke-dbstat 2>&1
            $diagnosticExitCode = $LASTEXITCODE
            if ($diagnosticExitCode -ne 0) {
              # Carry the diagnostic's own code so the gate can name the cause;
              # the packaged binary is GUI-subsystem and prints to no console.
              $exitCode = $diagnosticExitCode
              throw "NSIS diagnostic failed"
            }
            $exitCode = 0
          }
          catch {
            Write-Host "NSIS packaged smoke: failed"
          }
          finally {
            if ($installed) {
              $uninstaller = Join-Path $installDir "uninstall.exe"
              if (Test-Path -LiteralPath $uninstaller) {
                $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
                if ($uninstallProcess.ExitCode -ne 0) {
                  $exitCode = 1
                }
              } else {
                $exitCode = 1
              }
            }
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $installDir) {
              $exitCode = 1
            }
            "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            if ($exitCode -eq 0) {
              "- NSIS packaged dbstat smoke: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              "- NSIS packaged dbstat smoke: FAIL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          exit $exitCode

      - name: Fail if packaged dbstat smoke failed
        if: always()
        shell: pwsh
        run: |
          # Skipped smokes mean an earlier step already failed the job; blaming
          # them here would bury the real cause. Only a smoke that actually ran
          # can fail this gate, and its exit code names why.
          $checks = @(
            @{ Name = "MSI"; Outcome = "${{ steps.smoke-msi.outcome }}"; ExitCode = "${{ steps.smoke-msi.outputs.exit_code }}" }
            @{ Name = "NSIS"; Outcome = "${{ steps.smoke-nsis.outcome }}"; ExitCode = "${{ steps.smoke-nsis.outputs.exit_code }}" }
          )
          $failures = @()
          foreach ($check in $checks) {
            if ($check.Outcome -eq "skipped") {
              Write-Host "$($check.Name) packaged dbstat smoke: skipped (an earlier step failed)"
              continue
            }
            switch ($check.ExitCode) {
              "0" { Write-Host "$($check.Name) packaged dbstat smoke: PASS" }
              "2" { $failures += "$($check.Name): dbstat unavailable - the shipped SQLite lacks ENABLE_DBSTAT_VTAB" }
              "1" { $failures += "$($check.Name): packaged smoke harness failed (installer, executable discovery, or teardown)" }
              "3" { $failures += "$($check.Name): dbstat diagnostic runtime construction failed before a verdict" }
              "4" { $failures += "$($check.Name): dbstat diagnostic SQLite connection failed before a verdict" }
              "5" { $failures += "$($check.Name): dbstat diagnostic migration failed before a verdict" }
              "6" { $failures += "$($check.Name): dbstat diagnostic deterministic setup failed before a verdict" }
              "7" { $failures += "$($check.Name): dbstat diagnostic measurement failed before a verdict" }
              default { $failures += "$($check.Name): packaged smoke returned an unrecognized diagnostic or harness exit code ('$($check.ExitCode)')" }
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join "; ")
          }

      # --- Upload ---
      - name: Upload MSI installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-msi-v${{ steps.get-version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NSIS installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-nsis-v${{ steps.get-version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload compiled exe (for dev testing)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-exe-v${{ steps.get-version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/meetily.exe
          if-no-files-found: warn
          retention-days: 14

  # Quick cargo check on every push (faster than full build)
  check-rust:
    name: Cargo Check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned Rust channel from rust-toolchain.toml
        id: rust-channel
        shell: bash
        run: |
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' upstream/rust-toolchain.toml)
          if [ -z "$CHANNEL" ]; then echo "no channel found in upstream/rust-toolchain.toml"; exit 1; fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Verify active toolchain matches rust-toolchain.toml
        shell: pwsh
        run: |
          $expected = (Select-String -Path upstream/rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $actual = ((rustc --version) -replace '^rustc ', '') -replace ' \(.*\)$', ''
          Write-Host "rust-toolchain.toml channel: $expected; active rustc: $actual"
          if ($actual -ne $expected) {
            Write-Error "Active toolchain $actual does not match the pinned $expected"
            exit 1
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"
          key: windows-x64-check-v2

      - name: Fetch deps and restore whisper-rs-sys bindings
        shell: bash
        run: |
          cd upstream
          cargo fetch
          node frontend/scripts/restore-whisper-bindings.mjs

      - name: Cargo check workspace
        id: cargo-check
        shell: bash
        continue-on-error: true
        env:
          CARGO_DEBUG_LOG: ${{ runner.temp }}/cargo_check_out.txt
          CARGO_TARGET_DIR: target
        run: |
          cd upstream
          # Capture all cargo output (no color codes for clean parsing)
          LOG="$CARGO_DEBUG_LOG"
          CARGO_TERM_COLOR=never cargo check --workspace --message-format=short > "$LOG" 2>&1
          RC=$?
          echo "cargo_check_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "=== CARGO CHECK EXIT CODE: $RC ==="
          echo "--- CARGO OUTPUT START ---"
          cat "$LOG"
          echo "--- CARGO OUTPUT END ---"
          exit 0   # Always succeed; the artifact upload + a separate check step will surface the failure

      - name: Upload cargo check output (for public debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-output
          path: ${{ runner.temp }}/cargo_check_out.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if cargo check failed
        if: steps.cargo-check.outputs.cargo_check_exit_code != '0'
        shell: bash
        run: |
          echo "Cargo check failed with exit code ${{ steps.cargo-check.outputs.cargo_check_exit_code }}"
          exit 1
